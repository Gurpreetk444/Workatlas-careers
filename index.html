<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workatlas Careers | Job Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Workatlas Careers</div>
  <div class="search-bar">
    <input type="text" id="keyword" placeholder="Job title or keywords">
    <input type="text" id="location" placeholder="Location">
    <button onclick="filterJobs()">Search</button>
  </div>
</header>

<main>
  <section class="jobs-container" id="jobs-container">
    <!-- Job cards will be inserted here via JS -->
  </section>
</main>

<footer>
  <p>© 2025 Workatlas Staffing Group</p>
  <p>Email: hr@workatlasstaffinggroup.com</p>
</footer>

<script>
  // Job data
  const jobs = [
    {
      title: "Customer Support Executive (Voice Process)",
      company: "Workatlas",
      location: "Noida Sector 11",
      experience: "Freshers / 0-2 Years",
      perks: "Free Cab, Free Lunch",
      apply: "mailto:hr@workatlasstaffinggroup.com"
    },
    {
      title: "Sales & Marketing Executive",
      company: "Workatlas",
      location: "Delhi NCR",
      experience: "1-5 Years",
      perks: "Commission + Incentives",
      apply: "mailto:hr@workatlasstaffinggroup.com"
    },
    {
      title: "International Hiring Recruiter (US/Canada)",
      company: "Workatlas",
      location: "Remote",
      experience: "2-5 Years",
      perks: "Work from Home",
      apply: "mailto:hr@workatlasstaffinggroup.com"
    }
  ];

  const container = document.getElementById("jobs-container");

  function displayJobs(list) {
    container.innerHTML = "";
    if(list.length === 0) {
      container.innerHTML = "<p>No jobs found.</p>";
      return;
    }
    list.forEach(job => {
      const jobCard = document.createElement("div");
      jobCard.className = "job-card";
      jobCard.innerHTML = `
        <h3>${job.title}</h3>
        <p><strong>Company:</strong> ${job.company}</p>
        <p><strong>Location:</strong> ${job.location}</p>
        <p><strong>Experience:</strong> ${job.experience}</p>
        <p><strong>Perks:</strong> ${job.perks}</p>
        <a href="${job.apply}" class="btn">Apply Now</a>
      `;
      container.appendChild(jobCard);
    });
  }

  function filterJobs() {
    const keyword = document.getElementById("keyword").value.toLowerCase();
    const location = document.getElementById("location").value.toLowerCase();
    const filtered = jobs.filter(job => 
      job.title.toLowerCase().includes(keyword) &&
      job.location.toLowerCase().includes(location)
    );
    displayJobs(filtered);
  }

  // Initial display
  displayJobs(jobs);
</script>

</body>
</html>
